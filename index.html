<script> 
 window.imageDatabase = {}; 
 window.globalQCounter = 1; 
 function handleFallback(imgElem, key) { 
 let urls = window.imageDatabase[key]; 
 let idx = parseInt(imgElem.getAttribute('data-idx')) || 0; 
 idx++; 
 if (idx < urls.length) { 
 imgElem.setAttribute('data-idx', idx); 
 imgElem.src = urls[idx]; 
 } else { 
 imgElem.style.display = 'none'; 
 } 
 } 
 function enToBn(num) { 
 const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯']; 
 return num.toString().replace(/\d/g, match => bnDigits[match]); 
 } 
 function generateSVG(text, color) { 
 return `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 50'%3E%3Crect width='200' height='50' fill='%23f9f9f9' stroke='${color}'/%3E%3Ctext x='100' y='30' font-family='Arial' font-size='12' font-weight='bold' fill='${color}' text-anchor='middle'%3E${text}%3C/text%3E%3C/svg%3E`; 
 } 
 function renderTopic(topic) { 
 const container = document.getElementById('mcq-container'); 
 let html = `<div class="subject-heading">${topic.topicTitle}</div>`; 
 let tIndex = Date.now() + Math.floor(Math.random() * 1000); 
 topic.questions.forEach((item, qIndex) => { 
 let tagHtml = item.exam ? `<span class="tag">📌 ${item.exam}</span>` : (item.nclex ? `<span class="tag tag-nclex">⭐ ${item.nclex}</span>` : ""); 
 
 let optionsHtml = `<div class="options-container ${item.gridType}">`; 
 item.opts.forEach(opt => { optionsHtml += `<div class="option">${opt}</div>`; }); 
 optionsHtml += `</div>`; 
 let wrongOptsHtml = ''; 
 if(item.wrongOpts && item.wrongOpts.length > 0) { 
 wrongOptsHtml += `<div class="opt-analysis"><div class="opt-analysis-title">❌ অন্যান্য অপশন কেন ভুল:</div>`; 
 item.wrongOpts.forEach(w => { wrongOptsHtml += `<div class="opt-item"><strong>${w.opt}:</strong> ${w.text}</div>`; }); 
 wrongOptsHtml += `</div>`; 
 } 
 let imgHtml = ''; 
 if(item.imgs && item.imgs.length === 3) { 
 let uniqueKey = `img_${tIndex}_${qIndex}`; 
 window.imageDatabase[uniqueKey] = item.imgs; 
 imgHtml = `<div class="img-box"><img src="${item.imgs[0]}" data-idx="0" onerror="handleFallback(this, '${uniqueKey}')" alt="Medical Image"></div>`; 
 } 
 html += ` 
 <div class="mcq-item"> 
 <div class="q-text">${enToBn(window.globalQCounter++)}. ${item.q} ${tagHtml}</div> 
 ${optionsHtml} 
 <div class="explanation-block"> 
 <span class="ans-text">✅ সঠিক উত্তর: ${item.ans}</span> | 
 <b>💡 ব্যাখ্যা:</b> ${item.exp} 
 ${wrongOptsHtml} 
 ${imgHtml} 
 </div> 
 </div> 
 `; 
 }); 
 container.insertAdjacentHTML('beforeend', html); 
 } 
</script>

<script> 
 window.addEventListener('load', function() { 
 // পেজের সব প্রশ্ন ও ছবি জেনারেট হওয়ার জন্য ১.৫ সেকেন্ড অপেক্ষা করবে
 setTimeout(() => { 
 const imgBoxes = document.querySelectorAll('.img-box'); 
 
 imgBoxes.forEach(box => { 
 // ক্রস বাটনটিকে ছবির কোনায় বসানোর জন্য পজিশন সেট করা
 box.style.position = 'relative'; 
 box.style.display = 'inline-block'; 
 box.style.width = '100%'; 
 
 // ক্রস (❌) বাটন তৈরি করা
 const closeBtn = document.createElement('button'); 
 closeBtn.innerHTML = '✖'; 
 closeBtn.className = 'no-print'; // প্রিন্টে এই বাটন আসবে না
 
 // বাটনের ডিজাইন
 closeBtn.style.position = 'absolute'; 
 closeBtn.style.top = '2px'; 
 closeBtn.style.right = '5%'; // ছবির সাইজ অনুযায়ী ডানদিকে থাকবে
 closeBtn.style.background = 'rgba(179, 0, 0, 0.85)'; 
 closeBtn.style.color = '#fff'; 
 closeBtn.style.border = '1px solid #fff'; 
 closeBtn.style.borderRadius = '50%'; // গোল বাটন
 closeBtn.style.width = '20px'; 
 closeBtn.style.height = '20px'; 
 closeBtn.style.fontSize = '10px'; 
 closeBtn.style.fontWeight = 'bold'; 
 closeBtn.style.cursor = 'pointer'; 
 closeBtn.style.zIndex = '10'; 
 closeBtn.style.display = 'flex'; 
 closeBtn.style.alignItems = 'center'; 
 closeBtn.style.justifyContent = 'center'; 
 closeBtn.style.boxShadow = '0 2px 4px rgba(0,0,0,0.3)'; 
 
 // মাউস নিলে রং গাঢ় হবে
 closeBtn.onmouseover = () => closeBtn.style.background = '#ff0000'; 
 closeBtn.onmouseout = () => closeBtn.style.background = 'rgba(179, 0, 0, 0.85)'; 
 
 // ক্লিক করলে ওই নির্দিষ্ট ছবিটি হাইড হয়ে যাবে
 closeBtn.onclick = function() { 
 box.style.display = 'none'; 
 }; 
 
 // বাটনটি ছবির বক্সে যুক্ত করা
 box.appendChild(closeBtn); 
 }); 
 }, 1500); 
 }); 
</script>
